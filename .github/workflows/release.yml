name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          raw_tag="${GITHUB_REF_NAME}"
          echo "version_name=${raw_tag#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/pht-release.keystore"

      - name: Grant execute permission for gradlew
        working-directory: app
        run: chmod +x gradlew

      - name: Assemble signed release APK
        working-directory: app
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/pht-release.keystore
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifacts"
          cp app/app/build/outputs/apk/release/app-release.apk \
             "$RUNNER_TEMP/release-artifacts/pht-${{ steps.version.outputs.version_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ runner.temp }}/release-artifacts/*.apk
          retention-days: 7

  docker-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/loxitation/pht-api:${{ steps.version.outputs.version_name }}
            ${{ env.REGISTRY }}/loxitation/pht-api:latest

  docker-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/loxitation/pht-dashboard:${{ steps.version.outputs.version_name }}
            ${{ env.REGISTRY }}/loxitation/pht-dashboard:latest

  github-release:
    needs: [android-release, docker-api, docker-dashboard]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          generate_release_notes: true
          body: |
            ## Docker-Images

            ```
            ghcr.io/loxitation/pht-api:${{ github.ref_name }}
            ghcr.io/loxitation/pht-dashboard:${{ github.ref_name }}
            ```

            Siehe [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) fuer Portainer-/Compose-Deployment-Anleitung.

            ## Android-App

            `pht-*.apk` unten herunterladen und auf dem Geraet installieren (Unbekannte Quellen / "App-Installation von dieser Quelle zulassen" muss erlaubt sein).
